<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power PC | Tienda Digital</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- ENCABEZADO / NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <img src="img/logo.png" alt="Power PC Logo" id="logo-img" onerror="this.style.display='none'">
        <div class="brand-text">
          <h1>POWER <span>PC</span></h1>
          <p>PC's y Repuestos</p>
        </div>
      </div>
      <button class="cart-btn-trigger" id="cart-trigger">
        🛒 Carrito <span id="cart-count">0</span>
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container">
    <section class="catalog-section">
      <!-- Barra de Categorías Principales -->
      <div class="filter-bar" id="filter-bar">
        <span>Categorías:</span>
        <button class="filter-btn active" data-category="Todos">Todos</button>
        <button class="filter-btn" data-category="Laptops">Laptops</button>
        <button class="filter-btn" data-category="CPUs">CPUs</button>
        <button class="filter-btn" data-category="Monitores">Monitores</button>
        <button class="filter-btn" data-category="Periféricos">Periféricos</button>
        <button class="filter-btn" data-category="Oficina">Oficina</button>
        <button class="filter-btn" data-category="Repuestos">Repuestos</button>
        <button class="filter-btn" data-category="UPS">UPS</button>
        <button class="filter-btn" data-category="Videojuegos">Videojuegos</button>
      </div>

      <!-- Contenedor Dinámico de Subfiltros -->
      <div class="subfilter-container hidden" id="subfilter-container">
        <!-- Generado dinámicamente -->
      </div>

      <!-- Grilla de Catálogo -->
      <div class="product-grid" id="product-grid">
        <!-- Tarjetas dinámicas -->
      </div>
    </section>
  </main>

  <!-- PANEL LATERAL DE CARRITO -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h2>Tu Carrito</h2>
      <button class="close-btn" id="close-cart">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p class="empty-msg">El carrito está vacío.</p>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total-price">$0.00</span>
      </div>
      <button class="btn-send-ws" id="btn-checkout-ws">Pedir por WhatsApp 💬</button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
